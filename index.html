<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เบอร์มงคลรายเดือน</title>
<meta name="description" content="เลือกเบอร์มงคลรายเดือน ดูคำทำนายผลรวมและคู่เลข แล้วรับซิมที่สาขาใกล้คุณ">
<meta name="theme-color" content="#F2F3F5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F2F3F5; --card:#FFFFFF; --ink:#232833; --ink2:#4A4F5C; --muted:#868B97; --hair:#E4E5EA;
  --gold:#B0893F; --gold-deep:#8C6A2A; --gold-soft:#D9BD7E; --champ:#EEDFBC; --champ2:#F8F0DD;
  --good:#2E7D5B; --good-bg:#E6F2EC; --mid:#9A7420; --mid-bg:#F6EED9; --bad:#B4483B; --bad-bg:#F7E7E4;
  --num:'Prompt','IBM Plex Sans Thai Looped','Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;
  --body:'IBM Plex Sans Thai Looped','Noto Sans Thai Looped','Sarabun','Leelawadee UI',Tahoma,sans-serif;
  --r-card:18px; --r-ctl:12px; --shadow:0 8px 24px rgba(28,33,48,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink2);font:400 15px/1.6 var(--body);
  padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold-soft);outline-offset:2px;border-radius:8px}
img{max-width:100%;display:block}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(242,243,245,.92);backdrop-filter:saturate(1.4) blur(10px);
  -webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--hair);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand img{height:36px;width:auto}
.brand b{font:600 19px/1.2 var(--num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top nav{margin-left:auto;display:flex;gap:6px}
.ghost{border:1px solid var(--hair);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--ink)}
.ghost:hover{border-color:var(--gold-soft)}
.ghost{white-space:nowrap}
.ghost .sm{display:none}
@media (max-width:520px){.ghost .lg{display:none}.ghost .sm{display:inline}.ghost{padding:6px 12px;font-size:13.5px}.brand b{font-size:16.5px}}

/* ---------- hero (artwork) ---------- */
.hero{margin:16px auto 0;position:relative;border-radius:var(--r-card);overflow:hidden;background:var(--champ2);
  aspect-ratio:16/5;box-shadow:var(--shadow)}
.hero.m-square{aspect-ratio:16/5}
.hero.plain{aspect-ratio:auto;box-shadow:none;background:linear-gradient(180deg,var(--champ2),#F4ECD9)}
.slides{display:flex;height:100%;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.slide{flex:0 0 100%;height:100%}
.slide a,.slide picture{display:block;height:100%}
.slide img{width:100%;height:100%;object-fit:cover}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px}
.dots button{width:8px;height:8px;border-radius:99px;border:0;background:rgba(255,255,255,.6);padding:0}
.dots button[aria-current="true"]{width:22px;background:#fff}
.hero-text{height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px 32px}
.hero-text h1{margin:0;font:600 clamp(24px,4vw,40px)/1.15 var(--num);color:var(--ink)}
.hero-text p{margin:8px 0 0;color:var(--ink2);max-width:46ch}
@media (max-width:640px){
  .hero{aspect-ratio:16/7;margin-top:12px}
  .hero.plain{aspect-ratio:auto}
  .hero.m-square{aspect-ratio:4/3}
  .hero-text{padding:18px}
}

/* ---------- search ---------- */
.finder{margin-top:20px;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);padding:16px}
.search-row{display:flex;gap:10px;align-items:stretch}
.search{flex:1;position:relative}
.search input{width:100%;height:52px;border:1.5px solid var(--hair);border-radius:var(--r-ctl);padding:0 16px;
  font:600 20px var(--num);letter-spacing:.08em;color:var(--ink);background:#FBFBFC}
.search input::placeholder{font:400 15px var(--body);letter-spacing:0;color:var(--muted)}
.search input:focus{border-color:var(--gold);outline:none;background:#fff}
.seg{display:flex;background:#F1F1F3;border-radius:var(--r-ctl);padding:4px;flex:0 0 auto}
.seg button{border:0;background:transparent;border-radius:9px;padding:0 14px;font-size:14px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
@media (min-width:700px){.chips{flex-wrap:wrap;overflow:visible}}   /* v1.5.2 จอใหญ่: ขึ้นบรรทัดใหม่ ไม่ล้น */
@media (max-width:699px){.chips{padding-right:28px;-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent)}}   /* มือถือ: เลื่อนได้ มีเงาบอกว่ายังมีต่อ */
.chip{flex:0 0 auto;border:1px solid var(--hair);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.more-toggle{margin-top:12px;border:0;background:none;color:var(--gold-deep);font-weight:600;padding:4px 0}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:10px}
.filters[hidden]{display:none}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field select,.field input{width:100%;height:42px;border:1px solid var(--hair);border-radius:10px;padding:0 10px;background:#fff}
.digits{display:flex;flex-wrap:wrap;gap:6px}
.digits button{width:34px;height:34px;border-radius:9px;border:1px solid var(--hair);background:#fff;font:600 15px var(--num);color:var(--ink)}
.digits button[aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
#fLike button[aria-pressed="true"]{background:var(--good-bg);border-color:var(--good);color:var(--good);text-decoration:none}   /* v1.4 เลขที่ชอบ */
.chip .n{margin-left:6px;font-size:12px;opacity:.6}
.field.wide{grid-column:span 2}
@media (max-width:860px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){
  .search-row{flex-direction:column}
  .seg{align-self:flex-start}
  .seg button{padding:8px 14px}
  .field.wide{grid-column:span 2}
}

/* ---------- results ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 2px 12px}
.bar h2{margin:0;font:500 16px var(--body);color:var(--ink)}
.bar h2 b{font-family:var(--num);font-weight:600}
.bar select{height:38px;border:1px solid var(--hair);border-radius:10px;background:#fff;padding:0 10px}
.active-tags{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 2px 12px}
.tag{border:0;background:var(--champ2);color:var(--gold-deep);border-radius:999px;padding:4px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:16px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}

/* ---------- number card (ตามภาพแนบ) ---------- */
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.card .num{padding:20px 10px 4px;text-align:center;font:600 clamp(19px,2.1vw,25px)/1.2 var(--num);color:var(--ink);
  letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.card .sim{text-align:center;font-size:12.5px;color:var(--muted);padding-bottom:12px}
.rule{height:2px;background:linear-gradient(90deg,rgba(217,189,126,0) 0%,var(--gold-soft) 18%,var(--gold) 50%,var(--gold-soft) 82%,rgba(217,189,126,0) 100%)}
.card .cat{padding:14px 12px 4px;text-align:center;color:var(--ink);font-size:14.5px;line-height:1.45}
.card .hl{text-align:center;font-size:12.5px;color:var(--muted);padding:0 10px 12px;min-height:30px}
.card .pkg{margin-top:auto;padding:0 12px 14px}
.card .pkg-label{font-size:13.5px;color:var(--ink)}
.card .pkg-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.card .price{line-height:1.15}
.card .price b{display:block;font:500 17px var(--num);color:var(--ink)}
.card .price small{font-size:12.5px;font-weight:600;color:var(--ink)}
.card .price em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:2px}
.pick{border:1.5px solid var(--gold);background:#fff;color:var(--gold-deep);border-radius:999px;
  padding:9px 18px;font:600 16px var(--num);min-width:76px;transition:background .15s,color .15s}
.pick:hover{background:var(--gold);color:#fff}
.card .foot{border:0;width:100%;background:var(--champ);color:var(--gold-deep);padding:11px 8px;font:600 14px var(--num);
  display:flex;justify-content:center;align-items:center;gap:6px}
.card .foot:hover{background:#E8D5A8}
.card .foot svg{width:14px;height:14px}
@media (max-width:520px){
  .card .num{padding-top:16px}
  .card .cat{padding:10px 8px 2px;font-size:13px}
  .card .hl{font-size:11.5px;min-height:auto}
  .card .pkg{padding:0 10px 12px}
  .card .pkg-label{font-size:12px}
  .pick{padding:7px 12px;font-size:14px;min-width:60px}
  .card .price b{font-size:15px}
}
.loadmore{display:block;margin:24px auto 0;border:1.5px solid var(--gold);background:#fff;color:var(--gold-deep);
  border-radius:999px;padding:10px 26px;font:600 15px var(--num)}
.empty{background:var(--card);border-radius:var(--r-card);padding:32px 20px;text-align:center;color:var(--ink2)}
.empty b{display:block;font:600 18px var(--num);color:var(--ink);margin-bottom:6px}
.skeleton{height:250px;border-radius:var(--r-card);background:linear-gradient(90deg,#ececef 0%,#f6f6f8 50%,#ececef 100%);
  background-size:200% 100%;animation:sk 1.2s infinite linear}
@keyframes sk{to{background-position:-200% 0}}

footer{margin:48px 0 0;padding:28px 0 40px;border-top:1px solid var(--hair);font-size:13.5px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
footer button{border:0;background:none;color:var(--gold-deep);padding:0;font-weight:600}
footer p{margin:0;max-width:70ch}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(25,28,36,.45)}
.modal[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.15);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.slides{transition:none}.skeleton{animation:none}}
.sheet-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.sheet-head h3{margin:0;font:600 20px/1.3 var(--num);color:var(--ink);flex:1}
.x{border:0;background:#F1F1F3;width:36px;height:36px;border-radius:99px;font-size:20px;line-height:1;color:var(--ink2);flex:0 0 auto}
.btn{border:0;border-radius:var(--r-ctl);padding:13px 18px;font:600 16px var(--num);width:100%}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:var(--gold);color:#fff}
.btn.line{background:#fff;border:1.5px solid var(--hair);color:var(--ink)}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{flex:1}
.note{font-size:13px;color:var(--muted)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}

/* prediction */
.ribbon{display:flex;justify-content:center;gap:4px;margin:6px 0 4px}
.ribbon span{width:clamp(26px,8vw,40px);height:clamp(38px,11vw,54px);display:grid;place-items:center;border-radius:10px;
  background:#F5F5F7;font:600 clamp(18px,5vw,28px) var(--num);color:var(--ink);transition:background .15s,color .15s}
.ribbon span.pre{background:transparent;color:#B9BCC5}
.ribbon span.on{background:var(--ink);color:#fff}
.ribbon i{width:6px}
.ribbon-cap{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:16px}
.medal-row{display:flex;gap:16px;align-items:center;background:var(--champ2);border-radius:16px;padding:14px}
.medal{flex:0 0 auto;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 35% 30%,#fff 0%,#F6EBCF 55%,#E9D3A1 100%);box-shadow:inset 0 0 0 3px var(--gold-soft),inset 0 0 0 7px #fff,inset 0 0 0 8px var(--gold-soft)}
.medal b{display:block;font:700 30px/1 var(--num);color:var(--gold-deep)}
.medal small{font-size:11.5px;color:var(--gold-deep)}
.medal-row h4{margin:0 0 2px;font:600 16px var(--num);color:var(--ink)}
.medal-row p{margin:0;font-size:14px}
.score{display:flex;align-items:center;gap:10px;margin:16px 0 4px}
.score .track{flex:1;height:8px;border-radius:99px;background:#EEEEF1;overflow:hidden}
.score .fill{height:100%;background:linear-gradient(90deg,var(--gold-soft),var(--gold));border-radius:99px}
.score b{font:600 15px var(--num);color:var(--ink);white-space:nowrap}
.topics{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 6px}
.topic{background:#F7F7F9;border-radius:12px;padding:8px 4px;text-align:center}
.topic b{display:block;font:600 15px var(--num);color:var(--ink)}
.topic span{font-size:12px;color:var(--muted)}
.topic.up{background:var(--good-bg)} .topic.up b{color:var(--good)}
.topic.down{background:var(--bad-bg)} .topic.down b{color:var(--bad)}
.pairs{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.pairs li{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:12px;border:1px solid var(--hair);cursor:pointer}
.pairs li:hover,.pairs li.on{border-color:var(--gold-soft);background:#FFFCF5}
.pairs .pp{flex:0 0 auto;width:46px;height:40px;border-radius:10px;display:grid;place-items:center;font:600 18px var(--num)}
.lv-ดี .pp{background:var(--good-bg);color:var(--good)}
.lv-กลาง .pp{background:var(--mid-bg);color:var(--mid)}
.lv-ระวัง .pp{background:var(--bad-bg);color:var(--bad)}
.pairs p{margin:0;font-size:14px;color:var(--ink2)}
.pairs p b{font-weight:600;color:var(--ink)}
.badge{display:inline-block;font-size:12px;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.lv-ดี .badge,.badge.ดี{background:var(--good-bg);color:var(--good)}
.lv-กลาง .badge,.badge.กลาง{background:var(--mid-bg);color:var(--mid)}
.lv-ระวัง .badge,.badge.ระวัง{background:var(--bad-bg);color:var(--bad)}

/* booking */
.steps{display:flex;gap:6px;margin:0 0 16px;padding:0;list-style:none}
.steps li{flex:1;font-size:12px;color:var(--muted);text-align:center}
.steps li::before{content:"";display:block;height:4px;border-radius:99px;background:#ECECEF;margin-bottom:6px}
.steps li.done::before,.steps li.now::before{background:var(--gold)}
.steps li.now{color:var(--ink);font-weight:600}
.sel-num{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--champ2);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.sel-num b{font:600 22px var(--num);color:var(--ink);letter-spacing:.02em}
.sel-num span{font-size:13px;color:var(--gold-deep);text-align:right}
.sel-num{flex-wrap:wrap}   /* v1.5 */
.sel-num .cond{flex:1 0 100%;font-size:13.5px;color:var(--ink);border-top:1px dashed var(--gold-soft);padding-top:8px;margin-top:4px}
.sel-num .cond b{font:600 13.5px var(--body);letter-spacing:0;color:var(--gold-deep)}
.cond-line{background:var(--champ2);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--ink);margin:12px 0 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--hair);border-radius:14px;padding:12px 14px;cursor:pointer;background:#fff}
.opt:has(input:checked){border-color:var(--gold);background:#FFFCF5}
.opt input{margin-top:5px;accent-color:var(--gold-deep);width:18px;height:18px;flex:0 0 auto}
.opt .t{flex:1;min-width:0}
.opt .t b{font:600 16px var(--num);color:var(--ink)}
.opt .t .d{font-size:13px;color:var(--ink2);white-space:pre-line;margin-top:2px}
.opt .t .m{font-size:12.5px;color:var(--muted)}
.opt .r{text-align:right;font:600 16px var(--num);color:var(--ink);white-space:nowrap}
.opt .r small{display:block;font:400 12px var(--body);color:var(--muted)}
.mini{display:inline-block;font-size:11.5px;background:var(--ink);color:#fff;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.mini.g{background:var(--gold)}
.pickup-note{background:#F7F7F9;border-radius:12px;padding:10px 12px;font-size:14px;color:var(--ink);margin:0 0 12px}
.geo{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);margin-bottom:10px;min-height:24px}
.geo button{border:0;background:none;color:var(--gold-deep);font-weight:600;padding:0}
/* v1.3 — ปุ่มขอสิทธิ์ตำแหน่ง / ล้างตัวกรอง */
.geo.ok svg{width:16px;height:16px;color:var(--good);flex:0 0 auto}
.geo-box{background:#F7F7F9;border-radius:12px;padding:12px;margin-bottom:12px}
.geo-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--gold);background:#fff;color:var(--gold-deep);
  border-radius:12px;padding:11px 14px;font:600 15px var(--num)}
.geo-btn svg{width:18px;height:18px;flex:0 0 auto}
.geo-help{margin:8px 0 0;font-size:13px;color:var(--ink2)}
.geo-link{margin-top:8px;border:0;background:none;color:var(--gold-deep);font-weight:600;padding:0;font-size:13px}
.clearbtn{width:100%;height:42px;border:1.5px solid #EBC9C3;background:#fff;border-radius:10px;color:var(--bad);font-weight:600}
.tag.all{background:#fff;border:1px solid #EBC9C3;color:var(--bad)}
a.btn{display:block;text-align:center;text-decoration:none}
.form{display:grid;gap:12px}
.form label{font-size:13.5px;color:var(--ink)}
.form input,.form textarea{width:100%;border:1.5px solid var(--hair);border-radius:12px;padding:12px;background:#fff;margin-top:4px}
.form input:focus,.form textarea:focus{border-color:var(--gold);outline:none}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.consent input{width:18px;height:18px;margin-top:3px;accent-color:var(--gold-deep);flex:0 0 auto}
.hp{position:absolute;left:-9999px}
.sum-list{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px;margin:0}
.sum-list dt{color:var(--muted)}
.sum-list dd{margin:0;color:var(--ink);font-weight:500}
.done-code{text-align:center;padding:6px 0 4px}
.done-code small{display:block;color:var(--muted);font-size:13px}
.done-code b{font:700 28px var(--num);color:var(--ink);letter-spacing:.04em}
.timer{text-align:center;font-size:14px;color:var(--gold-deep);margin-bottom:12px}
.howto{margin:12px 0 0;padding-left:20px;font-size:14px;color:var(--ink2)}
.msg{width:100%;min-height:150px;border:1px solid var(--hair);border-radius:12px;padding:10px;background:#FAFAFB;font-size:13.5px;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.shop-meta{font-size:12.5px;color:var(--muted)}
.shop-links{display:flex;gap:12px;margin-top:4px;font-size:13px}
.shop-links a{color:var(--gold-deep);font-weight:600;text-decoration:none}
</style>

<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="./" id="brand"><b id="siteName">เบอร์มงคลรายเดือน</b></a>
    <nav>
      <button class="ghost" id="btnShops" type="button"><span class="lg">รับซิมใกล้คุณ</span><span class="sm">รับซิม</span></button>
      <button class="ghost" id="btnStatus" type="button"><span class="lg">เช็กการจอง</span><span class="sm">เช็กจอง</span></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero" id="hero" aria-label="โปรโมชัน"></section>

  <section class="finder" aria-label="ค้นหาเบอร์">
    <div class="search-row">
      <div class="search">
        <label class="sr" for="q">ค้นหาเลขที่ต้องการ</label>
        <input id="q" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="พิมพ์เลขที่อยากได้ เช่น 789 หรือวันเกิด">
      </div>
      <div class="seg" role="group" aria-label="ตำแหน่งเลข">
        <button type="button" data-mode="any" aria-pressed="true">มีเลขนี้</button>
        <button type="button" data-mode="end" aria-pressed="false">ลงท้ายด้วย</button>
      </div>
    </div>
    <div class="chips" id="catChips" role="group" aria-label="หมวดเบอร์"></div>
    <button class="more-toggle" id="moreToggle" type="button" aria-expanded="false" aria-controls="filters">ตัวกรองเพิ่มเติม</button>
    <div class="filters" id="filters" hidden>
      <div class="field"><label for="fTopic">เด่นด้าน</label>
        <select id="fTopic"><option value="">ทั้งหมด</option><option value="เงิน">การเงิน</option><option value="งาน">การงาน</option>
          <option value="รัก">ความรัก</option><option value="โชค">โชคลาภ</option></select></div>
      <div class="field"><label for="fPkg">แพ็กเกจเริ่มต้น</label><select id="fPkg"><option value="">ทุกแพ็กเกจ</option></select></div>
      <div class="field"><label for="fSum">ผลรวม</label><select id="fSum"><option value="">ทุกผลรวม</option></select></div>
      <div class="field wide"><label>เลขที่ชอบ (ต้องมีทุกตัวที่เลือก ไม่นับ 3 ตัวหน้า)</label><div class="digits" id="fLike"></div></div>
      <div class="field wide"><label>ไม่เอาเลข (ไม่นับ 3 ตัวหน้า)</label><div class="digits" id="fExcl"></div></div>
      <div class="field"><label for="fGood">คู่เลข</label><select id="fGood"><option value="">ทั้งหมด</option><option value="1">ไม่มีคู่ที่ควรเลี่ยง (ไม่มีคู่แดง)</option></select></div>
      <div class="field"><label aria-hidden="true">&nbsp;</label><button type="button" class="clearbtn" id="fClear">ล้างตัวกรองทั้งหมด</button></div>
    </div>
  </section>

  <div class="bar">
    <h2 id="count" aria-live="polite">กำลังโหลดเบอร์…</h2>
    <label class="sr" for="sort">เรียงตาม</label>
    <select id="sort">
      <option value="rec">แนะนำ (คะแนนคำทำนาย)</option>
      <option value="pkgAsc">แพ็กเกจ ต่ำ → สูง</option>
      <option value="pkgDesc">แพ็กเกจ สูง → ต่ำ</option>
      <option value="sum">ผลรวม</option>
    </select>
  </div>
  <div class="active-tags" id="tags"></div>
  <div class="grid" id="grid"></div>
  <button class="loadmore" id="more" type="button" hidden>ดูเบอร์เพิ่ม</button>
</main>

<footer>
  <div class="wrap">
    <p id="footNote">คำทำนายคำนวณจากศาสตร์ตัวเลข (ผลรวมและคู่เลข) ใช้ประกอบการตัดสินใจ ไม่ใช่การรับประกันผล</p>
    <button type="button" id="btnStatus2">ตรวจสอบสถานะการจอง</button>
  </div>
</footer>

<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle" id="sheet"></div></div>

<script>
/* ===================== ตั้งค่า ===================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbzYqIqQzq5n14XxhGZR5kFHXvh7mrkwT68R3djz9Josj42VrlM9ikUkY3xnIZRONyQ/exec';   // ← วาง URL Web App (/exec) ของ Apps Script ตรงนี้ · เว้นว่าง = โหมดตัวอย่าง
const PAGE = 40;

/* ===================== ข้อมูลตัวเลข ===================== */
const PLANET = ['ศูนย์','อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','ราหู','เกตุ'];
const PLANET_KW = ['การเริ่มต้นใหม่ ความว่าง','ผู้นำ เกียรติยศ ความมั่นใจ','ความอ่อนโยน เสน่ห์ จินตนาการ','ความกล้า พลังขับเคลื่อน',
  'การสื่อสาร การเจรจา ไหวพริบ','สติปัญญา ผู้ใหญ่อุปถัมภ์','ความรัก ความสุข การเงิน','ความอดทน ความรับผิดชอบ',
  'ความทะเยอทะยาน โชคลาภฉับพลัน','สิ่งศักดิ์สิทธิ์ สัญชาตญาณ ความสำเร็จ'];
const star = d => d===0 ? 'เลข 0' : 'ดาว' + PLANET[d];
const TOPIC_TH = {งาน:'การงาน', เงิน:'การเงิน', รัก:'ความรัก', โชค:'โชคลาภ', สุขภาพ:'สุขภาพ'};
const TOPIC_ORDER = ['งาน','เงิน','รัก','โชค','สุขภาพ'];

const S = {cfg:null, items:[], view:[], shown:0, pairs:{}, sums:{}, cat:{}, pkg:{}, shops:[], geo:null,
  f:{q:'', mode:'any', cat:'', topic:'', pkg:'', sum:'', branch:'', excl:new Set(), like:new Set(), good:'', sort:'rec'}};

/* ===================== utils ===================== */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum = n => n.slice(0,3)+'-'+n.slice(3,6)+'-'+n.slice(6);
const money = n => Number(n||0).toLocaleString('th-TH');
const truthy = v => v === true || /^(true|1|yes|y|ใช่)$/i.test(String(v).trim());
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }

function jsonp(action, p){
  return new Promise((resolve, reject) => {
    const cb = '__lk' + Date.now().toString(36) + Math.floor(Math.random()*1e5);
    const s = document.createElement('script');
    const netErr = () => Object.assign(new Error('เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่'), {net:true});   // v1.4
    const t = setTimeout(() => { done(); reject(netErr()); }, 45000);
    function done(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = r => { done(); if (r && r.ok) resolve(r.data); else { const e = new Error((r && r.error) || 'เกิดข้อผิดพลาด'); e.code = r && r.code; reject(e); } };
    s.onerror = () => { done(); reject(netErr()); };
    s.src = API_URL + '?action=' + encodeURIComponent(action) + '&callback=' + cb + (p ? '&p=' + encodeURIComponent(JSON.stringify(p)) : '') + '&_=' + Date.now();
    document.head.appendChild(s);
  });
}
const api = (action, p) => API_URL ? jsonp(action, p) : demoApi(action, p);

/* ===================== ศาสตร์ตัวเลข ===================== */
function pairInfo(p){
  const hit = S.pairs[p] || S.pairs[p[1]+p[0]];
  const a=+p[0], b=+p[1];
  const auto = a===b ? `พลัง${star(a)}ซ้อนกัน: ${PLANET_KW[a]}` : `${star(a)}คู่${star(b)}: ${PLANET_KW[a]} และ${PLANET_KW[b]}`;
  if (hit) return hit.meaning ? hit : {...hit, meaning: auto};   // v1.7 ตาราง 100 คู่: คู่ที่ยังไม่มีความหมาย ใช้ความหมายตามดาว
  return {level:'กลาง', topic:'', meaning: auto};
}
const LEVEL_TH = {'ดี':'ดี', 'กลาง':'สายนักสู้', 'ระวัง':'ควรเลี่ยง'};   // v1.7 ป้ายตามตารางเลือกเบอร์มงคล
function sumInfo(s){
  const hit = S.sums[s];
  if (hit) return hit;
  const r = s % 9 || 9;
  return {level:'กลาง', meaning:`ผลรวมอยู่ในพลัง${star(r)}: ${PLANET_KW[r]}`};
}
/* v1.7 — คะแนนถ่วงน้ำหนัก: คู่ท้ายสำคัญกว่าคู่หน้า, คู่ยอดนิยมได้เพิ่ม, ผลรวม, ความต่อเนื่องของคู่ดีช่วงท้าย */
const POS_W = [0.8, 0.85, 0.95, 1.05, 1.2, 1.5];   // คู่ที่ 1–6 = AB BC CD DE EF FG
const TOP_PAIRS = new Set(['24','42','56','65','59','95','89','98','45','54','36','63','14','41','15','51','19','91','78','87','26','62','28','82','46','64','69','96','99','55','44','66']);
function analyze(num){
  const sum = [...num].reduce((a,d)=>a+ +d, 0);
  const tail = num.slice(3), pairs = [], topics = {};
  TOPIC_ORDER.forEach(t => topics[t] = 0);
  let score = 40, bad = 0, mid = 0;
  for (let i=0;i<tail.length-1;i++){
    const p = tail[i]+tail[i+1], info = pairInfo(p), wt = POS_W[i] || 1;
    pairs.push({p, pos:3+i, ...info});
    const w = info.level==='ดี' ? 1 : info.level==='ระวัง' ? -1 : 0;
    if (w>0) score += (5 + (TOP_PAIRS.has(p) ? 1.6 : 0)) * wt;
    else if (w<0){ score -= 9 * wt; bad++; }
    else { score += 1 * wt; mid++; }
    String(info.topic||'').split(/[,\s]+/).filter(Boolean).forEach(t => { if (topics[t]!==undefined) topics[t]+=w; });
  }
  const si = sumInfo(sum);
  score += si.level==='ดี' ? 6 : si.level==='ระวัง' ? -7 : 0;
  const last = pairs[pairs.length-1], prev = pairs[pairs.length-2];
  if (last && last.level==='ดี') score += 2;
  if (last && prev && last.level==='ดี' && prev.level==='ดี') score += 2;
  score = Math.round(Math.max(1, Math.min(99, score)));
  const top = TOPIC_ORDER.filter(t => topics[t]>0 && t!=='สุขภาพ').sort((a,b)=>topics[b]-topics[a]).slice(0,2);
  const grade = score>=88 ? 'ดีเยี่ยม' : score>=80 ? 'ดีมาก' : score>=70 ? 'ดี' : score>=55 ? 'พอใช้' : 'ควรพิจารณา';
  return {sum, sumInfo:si, pairs, topics, top, score, grade, bad, mid};
}
const topText = (a, n=2) => a.top.length ? 'เด่นด้าน' + a.top.slice(0,n).map(t=>TOPIC_TH[t]).join('และ') : 'พลังสมดุล';

/* ===================== lookups ===================== */
function parsePromo(code){   // v1.1 — อ่านได้ทั้ง "Premium_699_6M" และ "1,199บ./12 เดือน"
  const s = String(code||'').trim(), t = s.replace(/,/g,'');
  const m = t.match(/(\d{2,5})\s*(?:บาท|บ\.?)?\s*[\/_\-\s]\s*(\d{1,2})\s*(?:M|เดือน|ด\.)/i);
  const price = m ? +m[1] : (+(t.match(/\d{3,5}/)||[0])[0]), months = m ? +m[2] : 0;
  const name = /^[A-Za-z]/.test(s) ? s.replace(/[_\s]*\d{1,2}\s*M$/i,'').replace(/_/g,' ').trim() : (price ? 'รายเดือน ' + money(price) : (s || 'แพ็กเกจรายเดือน'));
  return {code:s, name, price, months, detail:'', active:true};
}
/* v1.4 — แพ็กเกจกลาง (รหัส PKG-…) ตามหน้าเว็บผู้ให้บริการ ไม่แยกตามจำนวนเดือนสัญญา */
const isCat = code => String(code||'').indexOf('PKG-') === 0;
function catalog(){
  if (!S.catalog) S.catalog = Object.values(S.pkg).filter(r => isCat(r.code) && truthy(r.active))
    .map(r => ({code:r.code, name:r.name, price:+r.price, detail:r.detail||'', months:0, active:true})).sort((a,b)=>a.price-b.price);
  return S.catalog;
}
function pkgLabel(price){ const c = catalog().find(x => x.price === +price); return c ? c.name : 'แพ็กเกจรายเดือน ' + money(price); }
function pkgInfo(code){
  const row = S.pkg[code], base = parsePromo(code);
  const p = row ? {code, name: row.name || base.name, price: +row.price || base.price, months: +row.months || base.months, detail: row.detail || '', active: truthy(row.active)} : base;
  if (!isCat(code)){ const c = catalog().find(x => x.price === p.price); p.name = c ? c.name : 'แพ็กเกจรายเดือน ' + money(p.price); p.detail = c ? c.detail : ''; }
  return p;
}
function catInfo(raw){ return S.cat[raw] || {raw, display:'เบอร์มงคล', group:'เบอร์มงคล', description:'', simPrice:'', active:true}; }   // v1.5.2 หมวดที่ยังไม่มีชื่อแปล ไม่โชว์ชื่อดิบจากชีท
function simOf(it){
  let p = it.price;
  if (p === '' || p == null) p = catInfo(it.cat).simPrice;
  if (p === '' || p == null) p = S.cfg.settings.DEFAULT_SIM_PRICE;
  if (p === '' || p == null) return 'ค่าซิม สอบถามที่ร้าน';
  return +p > 0 ? `ค่าซิม ${money(p)} บาท` : 'ฟรีค่าซิม';
}
/** v1.5 — เงื่อนไขของเบอร์ ตามโปรเริ่มต้นในชีทสาขา */
function condText(it){
  const p = it && it.pkg; if (!p || !p.price) return '';
  return 'แพ็กเกจรายเดือนเริ่มต้น ' + money(p.price) + ' บาท' + (p.months ? ' ระยะสัญญา ' + p.months + ' เดือน' : '');
}
function shopOf(code){ return S.shops.find(s => String(s.code)===String(code)); }
function shopName(code){ const s = shopOf(code); return s ? s.name : ((S.cfg && S.cfg.names && S.cfg.names[code]) || 'สาขาใกล้คุณ'); }   // v1.2 ไม่โชว์รหัสสาขา

function buildLookups(){
  const c = S.cfg;
  S.pairs = {}; (c.pairs||[]).forEach(r => { const k = String(r.pair).padStart(2,'0'); if (/^\d\d$/.test(k)) S.pairs[k] = {level:r.level||'กลาง', topic:r.topic||'', meaning:r.meaning||''}; });
  S.sums = {};  (c.sums||[]).forEach(r => { if (r.sum!=='' ) S.sums[+r.sum] = {level:r.level||'กลาง', meaning:r.meaning||''}; });
  S.cat = {};   (c.categories||[]).forEach(r => S.cat[r.raw] = {...r, active: truthy(r.active)});
  S.pkg = {};   (c.packages||[]).forEach(r => S.pkg[r.code] = r); S.catalog = null;   // v1.4
  S.shops = (c.shops||[]).map(s => ({...s, lat:+s.lat||null, lng:+s.lng||null}));
}

/* ===================== โหลดข้อมูล ===================== */
/* v1.3 — โหลดเร็ว: ขอข้อมูลครั้งเดียว (boot) + จำข้อมูลล่าสุดไว้ในเครื่อง เปิดครั้งหน้าขึ้นทันที แล้วอัปเดตตามหลัง */
const CACHE_KEY = 'lk_boot_v1';
function readCache(){ try{ const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (c && c.cfg && c.data && Date.now() - c.t < 7*864e5) return c; }catch(e){} return null; }
function saveCache(cfg, data){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(), cfg, data})); }catch(e){ try{ localStorage.removeItem(CACHE_KEY); }catch(_){} } }
async function fetchBoot(){
  try{ const r = await api('boot'); if (r && r.cfg && r.nums) return {cfg:r.cfg, data:r.nums}; throw new Error('boot'); }
  catch(e){ if (!API_URL) throw e; const [cfg, data] = await Promise.all([api('config'), api('numbers')]); return {cfg, data}; }   // ระบบหลังบ้านรุ่นเก่า
}
const dataSig = (cfg, data) => [data.v || 0, (data.n || []).length, JSON.stringify(data.held || []), JSON.stringify(cfg)].join('|');
function setData(cfg, data){
  S.cfg = cfg; buildLookups();
  const held = new Set(data.held || []);
  let items = (data.n||[]).map(r => ({num:r[0], cat:data.c[r[1]], pkgCode:data.p[r[2]], branch:data.b[r[3]], price:r[4], grade:r[5]}))
    .filter(it => !held.has(it.branch+':'+it.num) && catInfo(it.cat).active !== false);
  const seenNum = new Set();   // v1.2.2 — เบอร์เดียวกันอยู่หลายชีทสาขา แสดงการ์ดเดียว
  items = items.filter(it => !seenNum.has(it.num) && seenNum.add(it.num));
  items.forEach(it => { it.a = analyze(it.num); it.pkg = pkgInfo(it.pkgCode); it.catD = catInfo(it.cat).display; it.catG = catInfo(it.cat).group || 'เบอร์มงคล'; it.tail = it.num.slice(3); });   // v1.6 catG = กลุ่ม
  S.items = items;
}
let booted = false, heroSig = '';
function renderAll(isRefresh){
  applySite();
  const hs = JSON.stringify((S.cfg.artwork || []).concat([S.cfg.settings.SITE_NAME, S.cfg.settings.SITE_TAGLINE]));
  if (hs !== heroSig){ heroSig = hs; renderHero(); }
  renderFilterOptions();
  if (!booted){ readUrl(); booted = true; }
  const keep = S.shown; apply();
  if (isRefresh) while (S.shown < keep && S.shown < S.view.length) renderMore();
}
function openDeepLink(){
  const n = new URLSearchParams(location.search).get('n');
  if (n){ const it = S.items.find(x => x.num===n.replace(/\D/g,'')); if (it) openPredict(it); }
}
async function init(){
  const cached = readCache(); let shownSig = '';
  if (cached){ try{ setData(cached.cfg, cached.data); renderAll(false); shownSig = dataSig(cached.cfg, cached.data); openDeepLink(); }catch(e){ shownSig = ''; } }
  if (!shownSig) renderSkeleton();
  try{
    const fresh = await fetchBoot();
    saveCache(fresh.cfg, fresh.data);
    if (dataSig(fresh.cfg, fresh.data) !== shownSig){ const first = !shownSig; setData(fresh.cfg, fresh.data); renderAll(!first); if (first) openDeepLink(); }
  }catch(e){
    if (!shownSig){
      $('#grid').innerHTML = `<div class="empty" style="grid-column:1/-1"><b>โหลดรายการเบอร์ไม่สำเร็จ</b>${esc(e.message)}<br><button class="loadmore" onclick="location.reload()">ลองอีกครั้ง</button></div>`;
      $('#count').textContent = '';
    }
  }
}

function applySite(){
  const st = S.cfg.settings || {};
  document.title = st.SITE_NAME || document.title;
  $('#siteName').textContent = st.SITE_NAME || 'เบอร์มงคลรายเดือน';
  const logo = $('#brand img');   // v1.3 เรียกซ้ำได้
  if (st.LOGO_URL && !logo) $('#brand').insertAdjacentHTML('afterbegin', `<img src="${esc(st.LOGO_URL)}" alt="">`);
  else if (logo) { if (st.LOGO_URL) logo.src = st.LOGO_URL; else logo.remove(); }
  if (st.DISCLAIMER) $('#footNote').textContent = st.DISCLAIMER;
}

/* ===================== hero / artwork ===================== */
let heroIdx = 0, heroTimer = null;
function renderHero(){
  const el = $('#hero'), arts = S.cfg.artwork || [], st = S.cfg.settings || {};
  if (!arts.length){
    el.classList.add('plain');
    el.innerHTML = `<div class="hero-text"><h1>${esc(st.SITE_NAME||'เบอร์มงคลรายเดือน')}</h1><p>${esc(st.SITE_TAGLINE||'')}</p></div>`;
    return;
  }
  el.classList.toggle('m-square', arts.every(a => a.imageMobile));
  el.innerHTML = `<div class="slides">${arts.map(a => {
    const img = `<picture>${a.imageMobile?`<source media="(max-width:640px)" srcset="${esc(a.imageMobile)}">`:''}<img src="${esc(a.imageDesktop||a.imageMobile)}" alt="${esc(a.title||'')}" loading="lazy"></picture>`;
    return `<div class="slide">${a.link?`<a href="${esc(a.link)}" target="_blank" rel="noopener">${img}</a>`:img}</div>`;}).join('')}</div>
    ${arts.length>1?`<div class="dots">${arts.map((a,i)=>`<button type="button" aria-label="ภาพที่ ${i+1}" data-i="${i}"></button>`).join('')}</div>`:''}`;
  const first = el.querySelector('img'); if (first) first.loading = 'eager';
  const go = i => { heroIdx = (i + arts.length) % arts.length; el.querySelector('.slides').style.transform = `translateX(-${heroIdx*100}%)`;
    el.querySelectorAll('.dots button').forEach((b,j)=>b.setAttribute('aria-current', j===heroIdx)); };
  el.querySelectorAll('.dots button').forEach(b => b.onclick = () => { go(+b.dataset.i); restart(); });
  let x0 = null;
  el.addEventListener('touchstart', e => x0 = e.touches[0].clientX, {passive:true});
  el.addEventListener('touchend', e => { if (x0===null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx)>40){ go(heroIdx + (dx<0?1:-1)); restart(); } x0=null; });
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function restart(){ clearInterval(heroTimer); if (arts.length>1 && !reduce) heroTimer = setInterval(()=>go(heroIdx+1), 6000); }
  go(0); restart();
}

/* v1.4 — ตัวกรองเชื่อมกัน: ตัวเลือกในแต่ละช่องคิดจากเบอร์ที่ผ่านตัวกรองช่องอื่น พร้อมจำนวน */
function passes(it, f, skip){
  if (f.q && skip!=='q'){ if (f.mode==='end' ? !it.num.endsWith(f.q) : !it.num.includes(f.q)) return false; }
  if (f.cat && skip!=='cat' && it.catG!==f.cat) return false;   // v1.6 กรองตามกลุ่ม
  if (f.branch && skip!=='branch' && it.branch!==f.branch) return false;
  if (f.pkg && skip!=='pkg' && it.pkg.price !== +f.pkg) return false;
  if (f.sum && skip!=='sum' && it.a.sum !== +f.sum) return false;
  if (f.topic && skip!=='topic' && !(it.a.topics[f.topic] > 0)) return false;
  if (f.good && skip!=='good' && (it.a.bad || (f.good==='2' && it.a.mid))) return false;   // v1.7
  for (const d of f.excl) if (it.tail.includes(d)) return false;
  for (const d of f.like) if (!it.tail.includes(d)) return false;
  return true;
}
function facet(skip, keyFn){
  const m = new Map();
  for (const it of S.items){
    if (!passes(it, S.f, skip)) continue;
    const k = keyFn(it); if (k == null) continue;
    (Array.isArray(k) ? k : [k]).forEach(x => m.set(x, (m.get(x)||0) + 1));
  }
  return m;
}
function fillFacet(sel, first, counts, keys, label, key){
  const cur = S.f[key];
  if (cur && !keys.some(k => String(k)===String(cur))) keys = keys.concat([cur]);
  $(sel).innerHTML = `<option value="">${first}</option>` + keys.map(k => `<option value="${esc(k)}">${esc(label(k))} (${money(counts.get(isNaN(+k)?k:+k) || counts.get(String(k)) || 0)})</option>`).join('');
  $(sel).value = cur || '';
}
function refreshFacets(){
  const f = S.f;
  const go = S.cfg.groups || [];   // v1.6 ปุ่มหมวด = กลุ่ม เรียงตามหน้าเว็บผู้ให้บริการ
  const ord = {}; go.forEach((g,i) => ord[g] = i);
  const cc = facet('cat', it => it.catG);
  let cats = [...cc.keys()]; if (f.cat && !cc.has(f.cat)) cats.push(f.cat);
  cats.sort((a,b) => (ord[a]??999)-(ord[b]??999) || (cc.get(b)||0)-(cc.get(a)||0));
  const all = [...cc.values()].reduce((a,b)=>a+b, 0);
  $('#catChips').innerHTML = `<button class="chip" type="button" data-cat="" aria-pressed="${!f.cat}">ทุกหมวด<span class="n">${money(all)}</span></button>` +
    cats.map(d => `<button class="chip" type="button" data-cat="${esc(d)}" aria-pressed="${d===f.cat}">${esc(d)}<span class="n">${money(cc.get(d)||0)}</span></button>`).join('');
  const pc = facet('pkg', it => it.pkg.price);
  fillFacet('#fPkg', 'ทุกแพ็กเกจ', pc, [...pc.keys()].sort((a,b)=>a-b), k => pkgLabel(k), 'pkg');
  const sc = facet('sum', it => it.a.sum);
  fillFacet('#fSum', 'ทุกผลรวม', sc, [...sc.keys()].sort((a,b)=>a-b), k => k + (S.sums[k]&&S.sums[k].level==='ดี' ? ' ผลรวมดี' : ''), 'sum');
  const tc = facet('topic', it => ['เงิน','งาน','รัก','โชค'].filter(t => it.a.topics[t] > 0));
  fillFacet('#fTopic', 'ทั้งหมด', tc, ['เงิน','งาน','รัก','โชค'].filter(t => tc.has(t)), k => TOPIC_TH[k], 'topic');
  const gc = facet('good', it => it.a.bad ? null : (it.a.mid ? ['1'] : ['1','2']));   // v1.7 ตามตารางเลือกเบอร์มงคล
  fillFacet('#fGood', 'ทั้งหมด', gc, ['1','2'].filter(k => gc.has(k)), k => k==='2' ? 'คู่ดีทุกคู่ (ไม่มีคู่ส้ม/แดง)' : 'ไม่มีคู่ที่ควรเลี่ยง (ไม่มีคู่แดง)', 'good');
}

/* v1.2.3 — ลิงก์บนแถบที่อยู่ตรงกับตัวกรองสาขาเสมอ (กด ✕ แล้ว ?b= หายไปด้วย) */
function syncUrl(){
  try{
    const u = new URL(location.href);
    if (S.f.branch) u.searchParams.set('b', S.f.branch); else u.searchParams.delete('b');
    const next = u.pathname + (u.searchParams.toString() ? '?' + u.searchParams.toString() : '') + u.hash;
    if (next !== location.pathname + location.search + location.hash) history.replaceState(null, '', next);
  }catch(e){}
}
function showBranch(code){
  const ok = S.items.some(it => it.branch === String(code));   // v1.4
  if (!ok){ toast('สาขานี้ยังไม่มีเบอร์ว่างบนเว็บ'); return; }
  S.f.branch = String(code);   // v1.5.2
  closeModal(); apply(); $('.bar').scrollIntoView({behavior:'smooth', block:'start'});
}
function apply(){
  const f = S.f;
  let v = S.items.filter(it => passes(it, f, null));   // v1.4
  refreshFacets();
  const by = {rec:(a,b)=>b.a.score-a.a.score || a.pkg.price-b.pkg.price, pkgAsc:(a,b)=>a.pkg.price-b.pkg.price || b.a.score-a.a.score,
    pkgDesc:(a,b)=>b.pkg.price-a.pkg.price, sum:(a,b)=>a.a.sum-b.a.sum};
  v.sort(by[f.sort] || by.rec);
  S.view = v; S.shown = 0;
  $('#grid').innerHTML = '';
  syncUrl();   // v1.2.3
  $('#count').innerHTML = v.length ? `พบ <b>${money(v.length)}</b> เบอร์` : 'ไม่พบเบอร์ที่ตรงเงื่อนไข';

    $('#grid').innerHTML = `<div class="empty" style="grid-column:1/-1"><b>ยังไม่มีเบอร์ตามเงื่อนไขนี้</b>ลองพิมพ์เลขให้สั้นลง หรือล้างตัวกรองบางอย่าง<br><button class="loadmore" type="button" onclick="resetFilters()">ล้างตัวกรองทั้งหมด</button></div>`;
    $('#more').hidden = true; return;

const B = {};
const STEP_NAMES = ['แพ็กเกจ','รับซิม','ข้อมูลติดต่อ','ยืนยัน'];
function openBooking(it){
  Object.assign(B, {it, step:0, pkg:it.pkgCode, shop:it.branch, name:B.name||'', phone:B.phone||'', note:'', consent:false, err:''});
  renderBooking();
}
function stepper(){ return `<ol class="steps">${STEP_NAMES.map((n,i)=>`<li class="${i<B.step?'done':i===B.step?'now':''}">${n}</li>`).join('')}</ol>`; }
function selNum(){ const c = condText(B.it); return `<div class="sel-num"><b>${fmtNum(B.it.num)}</b><span>หมวด ${esc(catInfo(B.it.cat).display)}<br>${esc(simOf(B.it))}</span>${c?`<div class="cond"><b>เงื่อนไขเบอร์</b> ${esc(c)}</div>`:''}</div>`; }   // v1.5
function distKm(a, b){
  const R=6371, r=x=>x*Math.PI/180, dLat=r(b.lat-a.lat), dLng=r(b.lng-a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function sortedShops(){
  let list = S.shops.slice();
  if (!truthy(S.cfg.settings.ALLOW_OTHER_SHOP)) list = list.filter(s => String(s.code)===String(B.it.branch));
  if (!list.some(s => String(s.code)===String(B.it.branch))) list.unshift({code:B.it.branch, name:shopName(B.it.branch)});
  list.forEach(s => s.km = (S.geo && s.lat && s.lng) ? distKm(S.geo, s) : null);
  list.sort((a,b) => (a.km ?? 1e9) - (b.km ?? 1e9));
  return list;
}
/* v1.3 — ขอสิทธิ์ตำแหน่งด้วยปุ่ม (มือถือหลายรุ่นไม่ยอมเด้งถามเองถ้าไม่ได้กด) */
const IN_APP = /FBAN|FBAV|FB_IAB|Instagram|Line\//i.test(navigator.userAgent);
const PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
function locate(force){
  if (S.geo && !force) return Promise.resolve(S.geo);
  return new Promise((res, rej) => {
    if (!navigator.geolocation){ S.geoErr = 'unsupported'; return rej(new Error('unsupported')); }
    S.geoBusy = true;
    navigator.geolocation.getCurrentPosition(
      p => { S.geoBusy = false; S.geoErr = ''; S.geo = {lat:p.coords.latitude, lng:p.coords.longitude}; res(S.geo); },
      err => { S.geoBusy = false; S.geoErr = err && err.code===1 ? 'denied' : err && err.code===3 ? 'timeout' : 'unavailable'; rej(err); },
      {enableHighAccuracy:false, timeout:12000, maximumAge:600000});
  });
}
function geoState(){
  try{ return navigator.permissions.query({name:'geolocation'}).then(p => p.state).catch(() => 'unknown'); }catch(e){ return Promise.resolve('unknown'); }
}
function geoHTML(){
  if (S.geo) return `<div class="geo ok">${PIN} เรียงสาขาจากตำแหน่งของคุณแล้ว</div>`;
  if (S.geoBusy) return `<div class="geo">กำลังหาตำแหน่งของคุณ…</div>`;
  let help = '';
  if (S.geoErr==='denied') help = IN_APP ? 'แอปนี้ปิดการใช้ตำแหน่งไว้ กดคัดลอกลิงก์ด้านล่าง แล้วเปิดใน Safari หรือ Chrome'
    : 'เบราว์เซอร์ปิดสิทธิ์ตำแหน่งไว้ เปิดได้ที่ iPhone: ตั้งค่า › ความเป็นส่วนตัว › บริการหาตำแหน่ง › Safari › ขณะใช้แอป | Android: แตะไอคอนหน้าลิงก์ด้านบน › สิทธิ์ › ตำแหน่ง › อนุญาต แล้วกดปุ่มอีกครั้ง';
  else if (S.geoErr==='timeout' || S.geoErr==='unavailable') help = 'หาตำแหน่งไม่สำเร็จ ลองเปิด GPS แล้วกดอีกครั้ง หรือเลือกสาขาจากรายการได้เลย';
  else if (S.geoErr==='unsupported') help = 'อุปกรณ์นี้ระบุตำแหน่งไม่ได้ เลือกสาขาจากรายการได้เลย';
  else if (IN_APP) help = 'ถ้ากดแล้วไม่มีหน้าต่างขออนุญาต ให้คัดลอกลิงก์ไปเปิดใน Safari หรือ Chrome';
  return `<div class="geo-box"><button type="button" class="geo-btn" data-geo>${PIN} อนุญาตตำแหน่ง เพื่อหาสาขาใกล้คุณ</button>
    ${help?`<p class="geo-help">${help}</p>`:''}${IN_APP?'<button type="button" class="geo-link" data-copylink>คัดลอกลิงก์ไปเปิดในเบราว์เซอร์</button>':''}</div>`;
}
/** ถ้าเคยอนุญาตไว้แล้ว หาตำแหน่งให้เองโดยไม่ต้องกด */
function geoAuto(){
  if (S.geo || S.geoBusy || S.geoAutoTried) return;
  geoState().then(st => { if (st==='granted'){ S.geoAutoTried = true; locate().catch(()=>{}).finally(() => S.geoRedraw && S.geoRedraw()); } });
}
function mapsLink(s){ return s.lat && s.lng ? `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}` : (s.mapUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.name)}`); }

function renderBooking(){
  const st = S.cfg.settings, it = B.it, start = it.pkg;
  let body = '';
  if (B.step===0){
    const higher = catalog().filter(c => c.price > start.price).map(c => pkgInfo(c.code)).slice(0, 8);   // v1.4 แพ็กเกจกลางที่สูงกว่า
    const opt = (p, tag) => `<label class="opt"><input type="radio" name="pkg" value="${esc(p.code)}" ${B.pkg===p.code?'checked':''}>
      <div class="t"><b>${esc(p.name)}</b>${tag}${p.detail?`<div class="d">${esc(p.detail)}</div>`:''}</div>
      <div class="r">${money(p.price)}<small>บาท/เดือน</small></div></label>`;
    body = `<p class="pickup-note">${esc(st.PICKUP_NOTE||'')}</p>
      <div class="opts">${opt(start,'<span class="mini">เริ่มต้น</span>')}${higher.map(p=>opt(p,'<span class="mini g">อัปเกรด</span>')).join('')}</div>
      ${higher.length?'':'<p class="note" style="margin-top:8px">เบอร์นี้มีแพ็กเกจเริ่มต้นเพียงแบบเดียว</p>'}`;
  } else if (B.step===1){
    const list = sortedShops();
    body = `<div id="geo">${geoHTML()}</div>
      <div class="opts">${list.map(s => `<label class="opt"><input type="radio" name="shop" value="${esc(s.code)}" ${String(B.shop)===String(s.code)?'checked':''}>
        <div class="t"><b>${esc(s.name)}</b>${String(s.code)===String(it.branch)?'<span class="mini g">เบอร์อยู่สาขานี้</span>':''}
        <div class="shop-meta">${s.hours?'เปิด '+esc(s.hours):''}${s.phone?' โทร '+esc(s.phone):''}</div>
        <div class="shop-links"><a href="${esc(mapsLink(s))}" target="_blank" rel="noopener">ดูแผนที่</a></div></div>
        <div class="r">${s.km!=null?(s.km<10?s.km.toFixed(1):Math.round(s.km))+'<small>กม.</small>':''}</div></label>`).join('')}</div>
      ${truthy(st.ALLOW_OTHER_SHOP)?'<p class="note" style="margin-top:8px">หากเลือกรับต่างสาขา พนักงานจะแจ้งระยะเวลาเตรียมซิมในแชท</p>':''}`;
  } else if (B.step===2){
    body = `<div class="form">
      <label>ชื่อผู้จอง<input id="fName" autocomplete="name" value="${esc(B.name)}" maxlength="80"></label>
      <label>เบอร์ติดต่อ<input id="fPhone" inputmode="tel" autocomplete="tel" value="${esc(B.phone)}" maxlength="12" placeholder="08x-xxx-xxxx"></label>
      <label>หมายเหตุถึงพนักงาน (ถ้ามี)<textarea id="fNote" rows="2" maxlength="300">${esc(B.note)}</textarea></label>
      <input class="hp" id="fHp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label class="consent"><input type="checkbox" id="fConsent" ${B.consent?'checked':''}><span>${esc(st.CONSENT_TEXT||'')}</span></label></div>`;
  } else if (B.step===3){
    const p = pkgInfo(B.pkg);
    body = `<dl class="sum-list"><dt>แพ็กเกจ</dt><dd>${esc(p.name)}<br><span class="note">${money(p.price)} บาท/เดือน</span></dd>
      ${condText(it)?`<dt>เงื่อนไขเบอร์</dt><dd>${esc(condText(it))}</dd>`:''}
      <dt>ค่าซิม</dt><dd>${esc(simOf(it).replace('ค่าซิม ',''))}</dd><dt>รับซิมที่</dt><dd>${esc(shopName(B.shop))}</dd>
      <dt>ชื่อ</dt><dd>${esc(B.name)}</dd><dt>เบอร์ติดต่อ</dt><dd>${esc(B.phone)}</dd>${B.note?`<dt>หมายเหตุ</dt><dd>${esc(B.note)}</dd>`:''}</dl>
      <p class="note" style="margin-top:14px">กดยืนยันแล้ว ระบบจะล็อกเบอร์ไว้ให้ ${esc(st.HOLD_MINUTES||60)} นาที และพาไปแชทกับพนักงานทาง Messenger เพื่อยืนยันการจอง</p>`;
  }
  const back = B.step>0 ? '<button class="btn line" type="button" id="bBack">ย้อนกลับ</button>' : '';
  const nextLabel = B.step===3 ? 'ยืนยันการจอง' : 'ถัดไป';
  openModal(`${head('เลือกเบอร์')}${stepper()}${selNum()}${body}${B.err?`<div class="err" role="alert">${esc(B.err)}</div>`:''}
    <div class="actions">${back}<button class="btn primary" type="button" id="bNext">${nextLabel}</button></div>`);
  B.err = ''; B.renderedAt = Date.now();   // v1.4
  const sh = $('#sheet');
  sh.querySelectorAll('input[name=pkg]').forEach(r => r.onchange = () => B.pkg = r.value);
  sh.querySelectorAll('input[name=shop]').forEach(r => r.onchange = () => B.shop = r.value);
  if (B.step===1){   // v1.3
    S.geoRedraw = () => { if (B.step===1 && !$('#modal').hidden && $('#sheet .steps')) renderBooking(); };
    geoAuto();
  }
  if ($('#bBack')) $('#bBack').onclick = () => { saveForm(); B.step--; renderBooking(); };
  $('#bNext').onclick = next;
}
function saveForm(){
  if (B.step!==2) return;
  B.name = $('#fName').value.trim(); B.phone = $('#fPhone').value.trim(); B.note = $('#fNote').value.trim();
  B.consent = $('#fConsent').checked; B.hp = $('#fHp').value;
}
async function next(){
  if (B.busy) return;                                   // v1.4 กดซ้ำระหว่างรอผล
  if (Date.now() - (B.renderedAt || 0) < 450) return;   // v1.4 แตะโดนปุ่มใหม่ทันทีหลังเปลี่ยนหน้า
  if (B.step===2){
    saveForm();
    const ph = B.phone.replace(/\D/g,'');
    if (B.name.length<2) { B.err='กรุณากรอกชื่อผู้จอง'; return renderBooking(); }
    if (!/[A-Za-zก-ฮ]{2,}/.test(B.name)) { B.err='กรุณากรอกชื่อผู้จองเป็นตัวอักษร ไม่ใช่ตัวเลข'; return renderBooking(); }   // v1.5.1
    if (!/^0\d{8,9}$/.test(ph)) { B.err='กรุณากรอกเบอร์ติดต่อ 10 หลัก เช่น 0812345678'; return renderBooking(); }
    if (!B.consent) { B.err='กรุณากดยินยอมการเก็บข้อมูลก่อนจอง'; return renderBooking(); }
  }
  if (B.step<3){ B.step++; return renderBooking(); }
  B.busy = true;
  const btn = $('#bNext'); btn.disabled = true; btn.textContent = 'กำลังล็อกเบอร์…';
  const payload = {number:B.it.num, branch:B.it.branch, pkg:B.pkg, shop:B.shop, name:B.name, phone:B.phone, note:B.note, consent:B.consent, hp:B.hp||''};
  try{
    let r;
    try { r = await api('book', payload); }
    catch(e1){
      if (!e1.net) throw e1;                             // เน็ตหลุด → ถามซ้ำ 1 ครั้ง (ระบบคืนรายการเดิมถ้าจองสำเร็จไปแล้ว)
      btn.textContent = 'กำลังตรวจสอบการจองอีกครั้ง…';
      await new Promise(z => setTimeout(z, 1500));
      r = await api('book', payload);
    }
    S.items = S.items.filter(x => !(x.num===B.it.num && x.branch===B.it.branch)); apply();
    showDone(r);
    if (r.repeated) toast('นี่คือรายการจองเดิมของคุณ');
  }catch(e){
    if (e.code==='TAKEN'){
      S.items = S.items.filter(x => !(x.num===B.it.num && x.branch===B.it.branch)); apply();
      openModal(`${head('เบอร์นี้ไม่ว่างแล้ว')}<p>${esc(e.message)}</p><div class="actions"><button class="btn primary x" type="button">เลือกเบอร์อื่น</button></div>`);
    } else { B.err = e.message; renderBooking(); }
  }finally{ B.busy = false; }
}

function copyText(t){
  let ok = false;
  try{ const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length); ok = document.execCommand('copy'); ta.remove(); }catch(e){}
  if (navigator.clipboard) navigator.clipboard.writeText(t).catch(()=>{});
  return ok || !!navigator.clipboard;
}
function showDone(r){
  const until = new Date(r.expiresAt);
  const hhmm = until.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
  if (truthy(S.cfg.settings.MESSENGER_AUTOCARD) && r.messengerUrl) return showDoneAuto(r, hhmm);   // v1.3
  openModal(`${head('ล็อกเบอร์ให้แล้ว')}
    <div class="done-code"><small>รหัสจอง</small><b>${esc(r.code)}</b></div>
    <div class="timer" id="timer">ล็อกไว้ถึง ${hhmm} น.</div>
    ${condText(B.it)?`<p class="cond-line" style="margin:0 0 12px"><b>เงื่อนไขเบอร์</b> ${esc(condText(B.it))}</p>`:''}
    <button class="btn gold" type="button" id="goChat">คัดลอกข้อความ แล้วเปิดแชท Messenger</button>
    <ol class="howto"><li>กดปุ่มด้านบน ระบบจะคัดลอกข้อความสรุปให้</li><li>ในแชท กดค้างที่ช่องพิมพ์ เลือก “วาง” แล้วส่ง</li><li>รอพนักงานตอบกลับเพื่อยืนยันการจอง</li></ol>
    <label class="note" for="msg" style="display:block;margin:14px 0 4px">ข้อความที่จะส่ง</label>
    <textarea class="msg" id="msg" readonly>${esc(r.message)}</textarea>
    <div class="actions"><button class="btn line" type="button" id="copyOnly">คัดลอกข้อความ</button><button class="btn line x" type="button">ปิด</button></div>`);
  $('#goChat').onclick = () => { copyText(r.message); toast('คัดลอกข้อความแล้ว'); if (r.messengerUrl) window.open(r.messengerUrl, '_blank', 'noopener'); else toast('ยังไม่ได้ตั้งค่าเพจ Facebook'); };
  $('#copyOnly').onclick = () => { copyText(r.message); toast('คัดลอกข้อความแล้ว'); };
  const tick = () => { const ms = r.expiresAt - Date.now(); const el = $('#timer'); if (!el) return;
    if (ms<=0){ el.textContent = 'หมดเวลาล็อกแล้ว หากพนักงานยังไม่ยืนยัน กรุณาจองใหม่'; clearInterval(modalTick); return; }
    const m = Math.floor(ms/60000), s = Math.floor(ms/1000)%60; el.textContent = `ล็อกไว้ถึง ${hhmm} น. (เหลือ ${m}:${String(s).padStart(2,'0')})`; };
  tick(); modalTick = setInterval(tick, 1000);
}

function openShops(){
  const draw = () => {
    const list = S.shops.slice(); list.forEach(s => s.km = (S.geo && s.lat && s.lng) ? distKm(S.geo, s) : null);
    list.sort((a,b) => (a.km ?? 1e9) - (b.km ?? 1e9));
    openModal(`${head('รับซิมใกล้คุณ')}<div id="geo" data-shops>${geoHTML()}</div>
      <div class="opts">${list.map(s => `<div class="opt" style="cursor:default"><div class="t"><b>${esc(s.name)}</b>
        <div class="shop-meta">${s.hours?'เปิด '+esc(s.hours):''}${s.phone?' โทร '+esc(s.phone):''}</div>
        <div class="shop-links"><a href="${esc(mapsLink(s))}" target="_blank" rel="noopener">นำทาง</a>
        <a href="?b=${encodeURIComponent(s.code)}" data-branch="${esc(s.code)}">ดูเบอร์ของสาขานี้</a></div></div>
        <div class="r">${s.km!=null?(s.km<10?s.km.toFixed(1):Math.round(s.km))+'<small>กม.</small>':''}</div></div>`).join('')}</div>`);
  };
  S.geoRedraw = () => { if (!$('#modal').hidden && $('#sheet [data-shops]')) draw(); };   // v1.3
  draw();
  geoAuto();
}
